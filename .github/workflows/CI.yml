name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so drift against the upstream C reference surfaces on its own.
    - cron: '0 4 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      # Only the kernel: the extension module needs a Python interpreter to
      # link against, and test-python covers that side.
      - run: cargo test -p catch22 --all-targets

  test-python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin pytest numpy
          # `maturin develop` needs a virtualenv to install into, and it puts
          # the compiled module next to the Python sources so `import
          # pycatch22_rs` resolves to the built extension rather than the bare
          # source directory.
          .venv/bin/maturin develop --release
      # The wheel is abi3-py311, so every version here exercises one binary.
      - run: .venv/bin/pytest tests/ -v

  # Rebuilds the original C implementation and re-checks the committed fixtures
  # against it, so drift in either direction shows up. Skipped on pull requests
  # because it clones an external repository.
  c-parity:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the pinned C reference
        run: |
          bash tools/c_reference/fetch.sh
          make -C tools/c_reference
      - name: Regenerate fixtures from C and diff against the committed ones
        run: |
          pip install numpy
          # No UCR archive on the runner, so this regenerates the edge cases
          # only and checks C still produces what is committed for them.
          python tools/make_fixtures.py --ucr-root /nonexistent \
            --driver tools/c_reference/driver_O2 --out /tmp/golden-regenerated.tsv
          python - <<'EOF'
          def load(path):
              return {
                  line.split('\t')[0]: line
                  for line in open(path)
                  if not line.startswith('#')
              }

          committed = load('tests/data/golden.tsv')
          regenerated = load('/tmp/golden-regenerated.tsv')
          drift = [
              name for name, line in regenerated.items()
              if name in committed and committed[name] != line
          ]
          if drift:
              raise SystemExit('C reference output drifted for: ' + ', '.join(drift))
          print(f'{len(regenerated)} fixtures still match the C reference')
          EOF

  wheels:
    needs: [lint, test-rust, test-python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
          - runner: macos-14
            target: aarch64
          - runner: macos-13
            target: x86_64
          - runner: windows-latest
            target: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # One abi3-py311 wheel per platform covers 3.11 and everything newer, so
      # there is no per-interpreter matrix here.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [wheels, sdist]
    permissions:
      # Used to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
