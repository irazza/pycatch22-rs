[workspace]
members = ["crates/catch22", "tools/ucr_check"]

[package]
name = "pycatch22-rs"
version = "0.1.0-rc.1"
edition = "2024"
description = "Python bindings for the catch22 time-series feature set, implemented in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/irazza/pycatch22-rs"

[lib]
name = "pycatch22_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
catch22 = { path = "crates/catch22" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
numpy = "0.29"
rayon = "1.12"

[profile.release]
lto = true
codegen-units = 1
