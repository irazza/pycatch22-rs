[project]
name = "pycatch22-rs"
dynamic = ["version"]
authors = [
  { name = "Alberto Azzari", email = "alberto.azzari@univr.it" },
]
description = "Rust implementation of the catch22 time-series feature set, verified against the original C"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.23.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pycatch22_rs.pycatch22_rs"

[project.urls]
Homepage = "https://github.com/irazza/pycatch22-rs"
Issues = "https://github.com/irazza/pycatch22-rs/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
